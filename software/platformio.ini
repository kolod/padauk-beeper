[env]
platform = https://github.com/m039/pdk-platformio.git
framework = easypdk

; The board files give ROM size in words, but PlatformIO checks firmware.bin
; in bytes (2 bytes per word). Limits below are in bytes, minus the top
; 16 words reserved for fuse / factory calibration.

[env:pfs154]
board = pfs154
board_upload.maximum_size = 4064

[env:pms150g]
board = pms150g
board_upload.maximum_size = 2016

[env:pfs122]
board = pfs122
board_upload.maximum_size = 4064

[env:pms150c]
board = pms150c
board_upload.maximum_size = 2016
